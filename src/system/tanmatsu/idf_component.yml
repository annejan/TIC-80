dependencies:
  idf: ">=6.0.2"
  badgeteam/badge-bsp: "=1.1.0"
  # WiFi lives on the ESP32-C6 and is reached over ESP-Hosted. wifi-manager
  # reads the networks the launcher already stored in NVS, so TIC-80 connects
  # to whatever the device is configured for without asking again.
  nicolaielectronics/wifi-manager: "=0.3.0"
  nicolaielectronics/tanmatsu-wifi: "=1.3.1"
  # Certificate bundle, for talking to tic80.com over HTTPS.
  badgeteam/custom-certificates: "=1.1.0"
